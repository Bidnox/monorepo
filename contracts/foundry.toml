[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{access = "read-write", path = "./deployments"}]

# Target network: Base Sepolia. ConfidentialAuction imports Lib.testnet.sol, which pins Inco
# Lightning at 0xe9CB49A5b16C6D4a093E5900AA8b450FD40541B6 on chainId 84532. Builds and deploys
# use this profile so the deployed bytecode always points at the real Sepolia deployment.

# Local test profile. Inco's fake infrastructure (MockOpHandler, FakeDecryptionAttester) is
# hardwired to the address in Lib.sol, so the encrypted-bid tests can only run if the auction
# resolves to that same constant. This profile remaps the single Lib.testnet.sol import onto
# Lib.sol; nothing else changes. Run tests with:
#
#   FOUNDRY_PROFILE=test forge test
#
[profile.test]
# Separate artifact directory: the two profiles compile ConfidentialAuction against different
# Inco addresses, and sharing `out` would let a test build overwrite the deployable artifact.
out = "out-test"
cache_path = "cache-test"
remappings = [
    "@inco/lightning/src/Lib.testnet.sol=lib/inco-lightning/src/Lib.sol",
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@inco/lightning/=lib/inco-lightning/",
]

[profile.test.fuzz]
runs = 512

[profile.test.invariant]
runs = 128
depth = 32
fail_on_revert = false

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
